name: CI Build & Quality Gates

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  secret-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    # gitleaks-action lists the pull request's commits, which needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-build-test:
    name: .NET Backend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Malabak.sln

      - name: Verify code formatting
        run: dotnet format --verify-no-changes --verbosity normal

      - name: Build with warnings as errors
        run: dotnet build Malabak.sln --no-restore -c Release -warnaserror

      - name: Run automated tests
        run: dotnet test Malabak.sln --no-build -c Release --verbosity normal

      - name: Check for vulnerable packages
        run: dotnet list Malabak.sln package --vulnerable --include-transitive

      - name: Verify OpenAPI contract & client staleness
        run: ./scripts/check-openapi-staleness.sh

  web-monorepo:
    name: Web Monorepo Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup pnpm (version pinned in web/package.json)
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Audit NPM dependencies for known vulnerabilities
        working-directory: ./web
        run: pnpm audit --audit-level=high

      - name: API client is generated from the committed OpenAPI snapshot
        working-directory: ./web
        run: pnpm --filter @malabak/api-client check

      - name: Turbo Build
        working-directory: ./web
        run: pnpm build

      - name: Install Playwright browser
        working-directory: ./web/apps/venue
        run: pnpm exec playwright install --with-deps chromium

      - name: Venue dashboard E2E (Flows B and C, accessibility)
        working-directory: ./web/apps/venue
        run: pnpm e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: venue-e2e-traces
          path: web/apps/venue/test-results
          retention-days: 7

      - name: Admin console E2E (role navigation, permission states, step-up)
        working-directory: ./web/apps/admin
        run: pnpm e2e

      - name: Upload admin Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-traces
          path: web/apps/admin/test-results
          retention-days: 7

  container-build-scan:
    name: Docker Multi-Stage Build & Security Scan
    runs-on: ubuntu-latest
    needs: [backend-build-test]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t malabak-api:local .
