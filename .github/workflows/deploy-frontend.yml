name: Deploy Frontends to Vercel

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy-landing:
    name: Deploy Landing to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Link & Pull Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_LANDING }}
        run: |
          mkdir -p .vercel
          echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
          npx --yes vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build with Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy Prebuilt to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          DEPLOY_OUTPUT=$(GIT_DIR=/dev/null npx --yes vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --yes 2>&1)
          EXIT_CODE=$?
          echo "$DEPLOY_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            if echo "$DEPLOY_OUTPUT" | grep -q "api-deployments-free-per-day"; then
              echo "::warning title=Vercel Free Tier Rate Limit::Vercel free tier daily limit of 100 API deployments reached. Deployment will resume once quota resets (24h) or when upgraded."
              exit 0
            else
              exit $EXIT_CODE
            fi
          fi

