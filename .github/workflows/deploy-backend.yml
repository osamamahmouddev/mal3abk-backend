name: Deploy Backend to MonsterASP.NET

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine Target Environment
        id: env-selector
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_ENV="production"
          else
            TARGET_ENV="staging"
          fi
          echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_ENV
          echo "Selected target environment: $TARGET_ENV"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Malabak.Api/Malabak.Api.csproj

      - name: Publish Release Binaries
        run: |
          dotnet publish src/Malabak.Api/Malabak.Api.csproj \
            -c Release \
            -o publish \
            /p:UseAppHost=false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy to /wwwroot via Secure FTP
        env:
          TARGET_ENV: ${{ env.TARGET_ENV }}
          # Production Credentials & Endpoints
          PROD_FTP_HOST: ${{ secrets.MONSTERASP_FTP_SERVER }}
          PROD_FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          PROD_FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          PROD_POSTGRES_CONNECTION: ${{ secrets.MALABAK_PRODUCTION_POSTGRES_CONNECTION }}
          PROD_REDIS_CONNECTION: ${{ secrets.MALABAK_PRODUCTION_REDIS_CONNECTION }}
          PROD_URL: "http://mal3abk.runasp.net"

          # Staging Credentials & Endpoints (MonsterASP site109978)
          STAGING_FTP_HOST: ${{ secrets.MONSTERASP_STAGING_FTP_SERVER || 'site109978.siteasp.net' }}
          STAGING_FTP_USER: ${{ secrets.MONSTERASP_STAGING_FTP_USERNAME || 'site109978' }}
          STAGING_FTP_PASS: ${{ secrets.MONSTERASP_STAGING_FTP_PASSWORD || '5d!XiF7?=8gL' }}
          STAGING_POSTGRES_CONNECTION: ${{ secrets.MALABAK_STAGING_POSTGRES_CONNECTION || 'Host=db81811.databaseasp.net;Port=5432;Database=db81811;Username=db81811;Password=8Mg?_5Gbx-9L;' }}
          STAGING_REDIS_CONNECTION: ${{ secrets.MALABAK_STAGING_REDIS_CONNECTION || secrets.MALABAK_PRODUCTION_REDIS_CONNECTION }}
          STAGING_URL: "http://mal3abk-staging.runasp.net"

          # Shared Security & Integration Settings
          ENCRYPTION_BLIND_INDEX_KEY: ${{ secrets.MALABAK_ENCRYPTION_BLIND_INDEX_KEY }}
          ENCRYPTION_CURRENT_KEK_ID: ${{ secrets.MALABAK_ENCRYPTION_CURRENT_KEK_ID }}
          ENCRYPTION_KEK_DEV_1: ${{ secrets.MALABAK_ENCRYPTION_KEK_DEV_1 }}
          SECURITY_JWT_PRIVATE_KEY_PEM: ${{ secrets.MALABAK_SECURITY_JWT_PRIVATE_KEY_PEM }}
          SECURITY_OTP_HMAC_SECRET: ${{ secrets.MALABAK_SECURITY_OTP_HMAC_SECRET }}
          SECURITY_STEPUP_SECRET: ${{ secrets.MALABAK_SECURITY_STEPUP_SECRET }}
          SECURITY_TURNSTILE_SECRET: ${{ secrets.MALABAK_SECURITY_TURNSTILE_SECRET }}
          OTP_SLACK_WEBHOOK: ${{ secrets.MALABAK_OTP_SLACK_WEBHOOK }}
          OTP_WHATSAPP_API_KEY: ${{ secrets.MALABAK_OTP_WHATSAPP_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, sys, time, ftplib, io, json, re, html, urllib.request, urllib.error

          target_env = os.environ.get("TARGET_ENV", "staging").lower()
          print("=" * 60)
          print(f"==> Initiating deployment for environment: {target_env.upper()}")
          print("=" * 60)

          if target_env == "production":
              host = os.environ.get("PROD_FTP_HOST")
              user = os.environ.get("PROD_FTP_USER")
              ftp_auth = os.environ.get("PROD_FTP_PASS")
              postgres_conn = os.environ.get("PROD_POSTGRES_CONNECTION")
              redis_conn = os.environ.get("PROD_REDIS_CONNECTION", "")
              target_url = os.environ.get("PROD_URL", "http://mal3abk.runasp.net").rstrip("/")
          else:
              host = os.environ.get("STAGING_FTP_HOST")
              user = os.environ.get("STAGING_FTP_USER")
              ftp_auth = os.environ.get("STAGING_FTP_PASS")
              postgres_conn = os.environ.get("STAGING_POSTGRES_CONNECTION")
              redis_conn = os.environ.get("STAGING_REDIS_CONNECTION", "")
              target_url = os.environ.get("STAGING_URL", "http://mal3abk-staging.runasp.net").rstrip("/")

          if not host or not user or not ftp_auth:
              print(f"Error: Missing FTP credentials for {target_env} environment.")
              sys.exit(1)

          if not postgres_conn:
              print(f"Error: Missing PostgreSQL connection string for {target_env} environment.")
              sys.exit(1)

          if "SSL Mode=" not in postgres_conn and "sslmode=" not in postgres_conn.lower():
              postgres_conn = postgres_conn.rstrip(";") + ";SSL Mode=Require;Trust Server Certificate=true;"

          local_dir = "publish"
          remote_root = "/wwwroot"

          # Configure appsettings.Development.json before deployment
          development_settings_path = os.path.join(local_dir, "appsettings.Development.json")
          with open(development_settings_path, encoding="utf-8") as stream:
              development_settings = json.load(stream)

          development_settings.setdefault("ConnectionStrings", {})["Postgres"] = postgres_conn
          development_settings.setdefault("Database", {})["ConnectionString"] = postgres_conn
          development_settings.setdefault("Database", {})["ResetOnStartup"] = False
          development_settings.setdefault("Database", {})["SeedOnStartup"] = True

          if redis_conn:
              development_settings.setdefault("ConnectionStrings", {})["Redis"] = redis_conn
              development_settings.setdefault("Redis", {})["ConnectionString"] = redis_conn
              development_settings["Redis"]["Ssl"] = True

          development_settings.setdefault("Identity", {}).setdefault("OtpDelivery", {})["Provider"] = "WhatsApp"
          development_settings["Identity"]["OtpDelivery"].setdefault("WhatsApp", {})["ApiKey"] = os.environ.get("OTP_WHATSAPP_API_KEY", "")
          development_settings["Identity"]["OtpDelivery"].setdefault("Slack", {})["WebhookUrl"] = os.environ.get("OTP_SLACK_WEBHOOK", "")

          with open(development_settings_path, "w", encoding="utf-8") as stream:
              json.dump(development_settings, stream, ensure_ascii=False, indent=2)

          def get_ftp():
              ftp = ftplib.FTP(host, timeout=30)
              ftp.login(user, ftp_auth)
              return ftp

          def ensure_remote_dir(ftp, remote_dir):
              parts = [p for p in remote_dir.replace("\\", "/").split("/") if p]
              current = remote_root
              for part in parts:
                  current += "/" + part
                  try:
                      ftp.cwd(current)
                  except ftplib.error_perm:
                      try:
                          ftp.mkd(current)
                      except ftplib.error_perm:
                          pass

          def patch_environment_variable(xml_text, name, value):
              if value is None:
                  return xml_text
              escaped_value = html.escape(str(value).replace("\r\n", "\n"), quote=True).replace("\n", "&#xA;")
              escaped_name = re.escape(name)
              pattern = rf'(name="{escaped_name}"\s+value=")[^"]*(")'
              replacement = rf'\g<1>{escaped_value}\g<2>'
              updated, count = re.subn(pattern, replacement, xml_text, count=1)
              if count:
                  return updated
              marker = "</environmentVariables>"
              entry = f'        <environmentVariable name="{name}" value="{escaped_value}" />\n'
              if marker in updated:
                  return updated.replace(marker, entry + "      " + marker, 1)
              return updated

          print(f"==> Connecting to FTP {host} for {remote_root}...")
          ftp = get_ftp()
          print("==> Connected.")

          ensure_remote_dir(ftp, "")
          ensure_remote_dir(ftp, "logs")

          print("==> Applying protected startup configuration...")
          ftp.cwd(remote_root)
          web_config = ""
          try:
              config_buffer = io.BytesIO()
              ftp.retrbinary("RETR web.config", config_buffer.write)
              web_config = config_buffer.getvalue().decode("utf-8-sig")
              print("    Read existing remote web.config.")
          except Exception as e:
              print(f"    Remote web.config not found ({e}). Falling back to local publish/web.config.")

          if not web_config.strip():
              local_cfg = os.path.join(local_dir, "web.config")
              if os.path.exists(local_cfg):
                  with open(local_cfg, "r", encoding="utf-8-sig") as fh:
                      web_config = fh.read()
                  print("    Loaded local publish/web.config template.")

          if "<environmentVariables>" not in web_config:
              if re.search(r'<aspNetCore\b[^>]*\/>', web_config):
                  web_config = re.sub(
                      r'<aspNetCore(\b[^>]*?)\s*\/>',
                      r'<aspNetCore\1>\n      <environmentVariables>\n      </environmentVariables>\n    </aspNetCore>',
                      web_config,
                      count=1
                  )
              elif "<aspNetCore" in web_config and "</aspNetCore>" in web_config:
                  web_config = web_config.replace("</aspNetCore>", "  <environmentVariables>\n      </environmentVariables>\n    </aspNetCore>", 1)

          web_config = re.sub(r'stdoutLogEnabled="false"', 'stdoutLogEnabled="true"', web_config)
          web_config = re.sub(r'\s+startupTimeLimit="[^"]*"', '', web_config)
          web_config = re.sub(r'hostingModel="[^"]*"', 'hostingModel="OutOfProcess" startupTimeLimit="180"', web_config)
          if 'hostingModel="OutOfProcess"' not in web_config:
              web_config = re.sub(r'<aspNetCore\b', '<aspNetCore hostingModel="OutOfProcess" startupTimeLimit="180"', web_config, count=1)
          web_config = patch_environment_variable(web_config, "ASPNETCORE_ENVIRONMENT", "Development")
          web_config = patch_environment_variable(web_config, "Database__MigrateOnStartup", "true")
          web_config = patch_environment_variable(web_config, "Hangfire__Enabled", "false")
          web_config = patch_environment_variable(web_config, "ConnectionStrings__Postgres", postgres_conn)
          web_config = patch_environment_variable(web_config, "Database__ConnectionString", postgres_conn)
          web_config = patch_environment_variable(web_config, "MALABAK_ConnectionStrings__Postgres", postgres_conn)
          web_config = patch_environment_variable(web_config, "MALABAK_Database__ConnectionString", postgres_conn)

          if redis_conn:
              web_config = patch_environment_variable(web_config, "ConnectionStrings__Redis", redis_conn)
              web_config = patch_environment_variable(web_config, "Redis__ConnectionString", redis_conn)
              web_config = patch_environment_variable(web_config, "Redis__Ssl", "true")
              web_config = patch_environment_variable(web_config, "MALABAK_ConnectionStrings__Redis", redis_conn)
              web_config = patch_environment_variable(web_config, "MALABAK_Redis__ConnectionString", redis_conn)
              web_config = patch_environment_variable(web_config, "MALABAK_Redis__Ssl", "true")

          web_config = patch_environment_variable(web_config, "Security__Encryption__CurrentKeyEncryptionKeyId", os.environ.get("ENCRYPTION_CURRENT_KEK_ID", "dev-kek-1"))
          web_config = patch_environment_variable(web_config, "Security__Encryption__KeyEncryptionKeys__dev-kek-1", os.environ.get("ENCRYPTION_KEK_DEV_1", ""))
          web_config = patch_environment_variable(web_config, "Security__Encryption__BlindIndexKey", os.environ.get("ENCRYPTION_BLIND_INDEX_KEY", ""))
          web_config = patch_environment_variable(web_config, "Security__Jwt__PrivateKeyPem", os.environ.get("SECURITY_JWT_PRIVATE_KEY_PEM", ""))
          web_config = patch_environment_variable(web_config, "Security__Otp__HmacSecret", os.environ.get("SECURITY_OTP_HMAC_SECRET", ""))
          web_config = patch_environment_variable(web_config, "Security__StepUp__SecretKey", os.environ.get("SECURITY_STEPUP_SECRET", ""))
          web_config = patch_environment_variable(web_config, "Security__Turnstile__SecretKey", os.environ.get("SECURITY_TURNSTILE_SECRET", ""))
          web_config = patch_environment_variable(web_config, "Security__Turnstile__BypassInDevelopment", "true")
          web_config = patch_environment_variable(web_config, "Database__ResetOnStartup", "false")
          web_config = patch_environment_variable(web_config, "Database__SeedOnStartup", "true")
          web_config = patch_environment_variable(web_config, "Identity__OtpDelivery__Provider", "WhatsApp")
          web_config = patch_environment_variable(web_config, "Identity__OtpDelivery__WhatsApp__ApiKey", os.environ.get("OTP_WHATSAPP_API_KEY", ""))
          web_config = patch_environment_variable(web_config, "Identity__OtpDelivery__Slack__WebhookUrl", os.environ.get("OTP_SLACK_WEBHOOK", ""))

          ftp.storbinary("STOR web.config", io.BytesIO(web_config.encode("utf-8")))
          try:
              ftp.cwd("/")
              ftp.storbinary("STOR web.config", io.BytesIO(web_config.encode("utf-8")))
          except Exception:
              pass
          print("    web.config written successfully.")

          print("==> Stopping IIS process with app_offline.htm...")
          ftp.cwd(remote_root)
          ftp.storbinary("STOR app_offline.htm", io.BytesIO(b"<!DOCTYPE html><html><body><h1>Deploying updates...</h1></body></html>"))
          time.sleep(4)

          files = []
          for root, _, filenames in os.walk(local_dir):
              for f in filenames:
                  lp = os.path.join(root, f)
                  rp = os.path.relpath(lp, local_dir).replace("\\", "/")
                  if rp.startswith("runtimes/linux") or rp.startswith("runtimes/osx"):
                      continue
                  if rp == "web.config":
                      continue
                  files.append((lp, rp))

          total = len(files)
          print(f"==> Uploading {total} files...")
          uploaded = 0
          for lp, rp in files:
              rdir = os.path.dirname(rp)
              rfile = os.path.basename(rp)
              for attempt in range(3):
                  try:
                      ftp.cwd(remote_root)
                      if rdir:
                          ensure_remote_dir(ftp, rdir)
                          ftp.cwd(remote_root + "/" + rdir)
                      with open(lp, "rb") as fh:
                          ftp.storbinary(f"STOR {rfile}", fh)
                      uploaded += 1
                      if uploaded % 25 == 0 or uploaded == total:
                          print(f"    Uploaded: [{uploaded}/{total}]")
                      break
                  except Exception as e:
                      print(f"    [Retry {attempt+1}] {rp}: {e}")
                      time.sleep(1)
                      try: ftp.quit()
                      except: pass
                      ftp = get_ftp()

          print("==> Starting app by removing app_offline.htm...")
          ftp.cwd(remote_root)
          try:
              ftp.delete("app_offline.htm")
          except Exception as e:
              print(f"Warning deleting app_offline: {e}")
          ftp.quit()

          print("==> Waiting 8 seconds for application boot...")
          time.sleep(8)

          print(f"==> Verifying Health at {target_url}/health/ready...")
          for i in range(12):
              try:
                  req = urllib.request.Request(f"{target_url}/health/ready", headers={"User-Agent": "GitHubActions/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as res:
                      if res.status == 200:
                          print(f"==> Deployment Successful! Health: 200 OK at {target_url}")
                          sys.exit(0)
              except Exception as e:
                  print(f"    Waiting for startup ({i+1}/12): {e}")
                  time.sleep(5)
          print("==> Health verification timed out.")
          sys.exit(1)
          EOF

      - name: Collect startup diagnostics
        if: failure()
        env:
          TARGET_ENV: ${{ env.TARGET_ENV }}
          PROD_FTP_HOST: ${{ secrets.MONSTERASP_FTP_SERVER }}
          PROD_FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          PROD_FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          STAGING_FTP_HOST: ${{ secrets.MONSTERASP_STAGING_FTP_SERVER || 'site109978.siteasp.net' }}
          STAGING_FTP_USER: ${{ secrets.MONSTERASP_STAGING_FTP_USERNAME || 'site109978' }}
          STAGING_FTP_PASS: ${{ secrets.MONSTERASP_STAGING_FTP_PASSWORD || '5d!XiF7?=8gL' }}
        run: |
          python3 - << 'EOF'
          import ftplib, os, pathlib

          target_env = os.environ.get("TARGET_ENV", "staging").lower()
          if target_env == "production":
              host = os.environ.get("PROD_FTP_HOST")
              user = os.environ.get("PROD_FTP_USER")
              password = os.environ.get("PROD_FTP_PASS")
          else:
              host = os.environ.get("STAGING_FTP_HOST")
              user = os.environ.get("STAGING_FTP_USER")
              password = os.environ.get("STAGING_FTP_PASS")

          output_dir = pathlib.Path("startup-diagnostics")
          output_dir.mkdir(exist_ok=True)

          if host and user and password:
              try:
                  ftp = ftplib.FTP(host, timeout=30)
                  ftp.login(user, password)
                  entries = ftp.nlst("/wwwroot/logs")
                  logs = [entry for entry in entries if entry.lower().endswith(".log")]
                  if logs:
                      latest = sorted(logs)[-1]
                      destination = output_dir / pathlib.PurePosixPath(latest).name
                      with destination.open("wb") as stream:
                          ftp.retrbinary(f"RETR {latest}", stream.write)
                      print(f"Collected startup log: {destination.name}")
                  else:
                      print("No startup log was found in /wwwroot/logs")
                  ftp.quit()
              except Exception as e:
                  print(f"Could not retrieve startup diagnostics: {e}")
          EOF

      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monsterasp-startup-diagnostics-${{ env.TARGET_ENV }}
          path: startup-diagnostics/
          if-no-files-found: warn
