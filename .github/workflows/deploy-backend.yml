name: Deploy Backend to MonsterASP.NET

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy-backend:
    name: Build & FTP Deploy to MonsterASP.NET
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Malabak.Api/Malabak.Api.csproj

      - name: Publish Release Binaries
        run: |
          dotnet publish src/Malabak.Api/Malabak.Api.csproj \
            -c Release \
            -o publish \
            /p:UseAppHost=false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy to /wwwroot via Secure FTP
        env:
          FTP_HOST: ${{ secrets.MONSTERASP_FTP_SERVER }}
          FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
          ENCRYPTION_BLIND_INDEX_KEY: ${{ secrets.MALABAK_ENCRYPTION_BLIND_INDEX_KEY }}
          ENCRYPTION_CURRENT_KEK_ID: ${{ secrets.MALABAK_ENCRYPTION_CURRENT_KEK_ID }}
          ENCRYPTION_KEK_DEV_1: ${{ secrets.MALABAK_ENCRYPTION_KEK_DEV_1 }}
          SECURITY_JWT_PRIVATE_KEY_PEM: ${{ secrets.MALABAK_SECURITY_JWT_PRIVATE_KEY_PEM }}
          SECURITY_OTP_HMAC_SECRET: ${{ secrets.MALABAK_SECURITY_OTP_HMAC_SECRET }}
          SECURITY_STEPUP_SECRET: ${{ secrets.MALABAK_SECURITY_STEPUP_SECRET }}
          SECURITY_TURNSTILE_SECRET: ${{ secrets.MALABAK_SECURITY_TURNSTILE_SECRET }}
          OTP_SLACK_WEBHOOK: ${{ secrets.MALABAK_OTP_SLACK_WEBHOOK }}
          OTP_WHATSAPP_API_KEY: ${{ secrets.MALABAK_OTP_WHATSAPP_API_KEY || 'was_SBdrYUiYjK3_wxo_XtqIr9j5Gr_ehUZY' }}
          PRODUCTION_POSTGRES_CONNECTION: ${{ secrets.MALABAK_PRODUCTION_POSTGRES_CONNECTION }}
          PRODUCTION_REDIS_CONNECTION: ${{ secrets.MALABAK_PRODUCTION_REDIS_CONNECTION }}
        run: |
          python3 - << 'EOF'
          import os, sys, time, ftplib, io, json, urllib.request, urllib.error

          host = os.environ["FTP_HOST"]
          user = os.environ["FTP_USER"]
          ftp_auth = os.environ["FTP_PASS"]
          local_dir = "publish"
          remote_root = "/wwwroot"

          # The application loads appsettings.Development.json before its
          # prefixed cloud environment source. Put the required connection
          # settings in that deployed file as a fallback for IIS environment
          # variable handling, without committing secrets to the repository.
          development_settings_path = os.path.join(local_dir, "appsettings.Development.json")
          with open(development_settings_path, encoding="utf-8") as stream:
              development_settings = json.load(stream)
          development_settings.setdefault("ConnectionStrings", {})["Postgres"] = os.environ["PRODUCTION_POSTGRES_CONNECTION"]
          development_settings.setdefault("ConnectionStrings", {})["Redis"] = os.environ["PRODUCTION_REDIS_CONNECTION"]
          development_settings.setdefault("Database", {})["ConnectionString"] = os.environ["PRODUCTION_POSTGRES_CONNECTION"]
          development_settings.setdefault("Database", {})["ResetOnStartup"] = True
          development_settings.setdefault("Database", {})["SeedOnStartup"] = True
          development_settings.setdefault("Redis", {})["ConnectionString"] = os.environ["PRODUCTION_REDIS_CONNECTION"]
          development_settings["Redis"]["Ssl"] = True
          development_settings.setdefault("Identity", {}).setdefault("OtpDelivery", {})["Provider"] = "WhatsApp"
          development_settings["Identity"]["OtpDelivery"].setdefault("WhatsApp", {})["ApiKey"] = os.environ.get("OTP_WHATSAPP_API_KEY", "was_SBdrYUiYjK3_wxo_XtqIr9j5Gr_ehUZY")
          development_settings["Identity"]["OtpDelivery"].setdefault("Slack", {})["WebhookUrl"] = os.environ.get("OTP_SLACK_WEBHOOK", "")
          with open(development_settings_path, "w", encoding="utf-8") as stream:
              json.dump(development_settings, stream, ensure_ascii=False, indent=2)

          def get_ftp():
              ftp = ftplib.FTP(host, timeout=30)
              ftp.login(user, ftp_auth)
              return ftp

          def ensure_remote_dir(ftp, remote_dir):
              parts = [p for p in remote_dir.replace("\\", "/").split("/") if p]
              current = remote_root
              for part in parts:
                  current += "/" + part
                  try:
                      ftp.cwd(current)
                  except ftplib.error_perm:
                      try:
                          ftp.mkd(current)
                      except ftplib.error_perm:
                          pass

          def patch_environment_variable(xml_text, name, value):
              import html, re
              value = html.escape(value.replace("\r\n", "\n"), quote=True).replace("\n", "&#xA;")
              escaped_name = re.escape(name)
              pattern = rf'(name="{escaped_name}"\s+value=")[^"]*(")'
              replacement = rf'\g<1>{value}\g<2>'
              updated, count = re.subn(pattern, replacement, xml_text, count=1)
              if count:
                  return updated
              marker = "</environmentVariables>"
              entry = f'        <environmentVariable name="{name}" value="{value}" />\n'
              if marker in updated:
                  return updated.replace(marker, entry + "      " + marker, 1)
              return updated

          print(f"==> Connecting to FTP {host} for {remote_root}...")
          ftp = get_ftp()
          print("==> Connected.")

          print("==> Applying protected startup configuration...")
          ftp.cwd(remote_root)
          config_buffer = io.BytesIO()
          ftp.retrbinary("RETR web.config", config_buffer.write)
          web_config = config_buffer.getvalue().decode("utf-8-sig")
          web_config = patch_environment_variable(web_config, "ASPNETCORE_ENVIRONMENT", "Development")
          web_config = patch_environment_variable(web_config, "Database__MigrateOnStartup", "false")
          web_config = patch_environment_variable(web_config, "Hangfire__Enabled", "false")
          web_config = patch_environment_variable(web_config, "ConnectionStrings__Postgres", os.environ["PRODUCTION_POSTGRES_CONNECTION"])
          web_config = patch_environment_variable(web_config, "Database__ConnectionString", os.environ["PRODUCTION_POSTGRES_CONNECTION"])
          web_config = patch_environment_variable(web_config, "ConnectionStrings__Redis", os.environ["PRODUCTION_REDIS_CONNECTION"])
          web_config = patch_environment_variable(web_config, "Redis__ConnectionString", os.environ["PRODUCTION_REDIS_CONNECTION"])
          web_config = patch_environment_variable(web_config, "Redis__Ssl", "true")
          web_config = patch_environment_variable(web_config, "MALABAK_ConnectionStrings__Postgres", os.environ["PRODUCTION_POSTGRES_CONNECTION"])
          web_config = patch_environment_variable(web_config, "MALABAK_Database__ConnectionString", os.environ["PRODUCTION_POSTGRES_CONNECTION"])
          web_config = patch_environment_variable(web_config, "MALABAK_ConnectionStrings__Redis", os.environ["PRODUCTION_REDIS_CONNECTION"])
          web_config = patch_environment_variable(web_config, "MALABAK_Redis__ConnectionString", os.environ["PRODUCTION_REDIS_CONNECTION"])
          web_config = patch_environment_variable(web_config, "MALABAK_Redis__Ssl", "true")
          web_config = patch_environment_variable(web_config, "Security__Encryption__CurrentKeyEncryptionKeyId", os.environ["ENCRYPTION_CURRENT_KEK_ID"])
          web_config = patch_environment_variable(web_config, "Security__Encryption__KeyEncryptionKeys__dev-kek-1", os.environ["ENCRYPTION_KEK_DEV_1"])
          web_config = patch_environment_variable(web_config, "Security__Encryption__BlindIndexKey", os.environ["ENCRYPTION_BLIND_INDEX_KEY"])
          web_config = patch_environment_variable(web_config, "Security__Jwt__PrivateKeyPem", os.environ["SECURITY_JWT_PRIVATE_KEY_PEM"])
          web_config = patch_environment_variable(web_config, "Security__Otp__HmacSecret", os.environ["SECURITY_OTP_HMAC_SECRET"])
          web_config = patch_environment_variable(web_config, "Security__StepUp__SecretKey", os.environ["SECURITY_STEPUP_SECRET"])
          web_config = patch_environment_variable(web_config, "Security__Turnstile__SecretKey", os.environ["SECURITY_TURNSTILE_SECRET"])
          web_config = patch_environment_variable(web_config, "Security__Turnstile__BypassInDevelopment", "true")
          web_config = patch_environment_variable(web_config, "Database__ResetOnStartup", "false")
          web_config = patch_environment_variable(web_config, "Database__SeedOnStartup", "true")
          web_config = patch_environment_variable(web_config, "Identity__OtpDelivery__Provider", "WhatsApp")
          web_config = patch_environment_variable(web_config, "Identity__OtpDelivery__WhatsApp__ApiKey", os.environ.get("OTP_WHATSAPP_API_KEY", "was_SBdrYUiYjK3_wxo_XtqIr9j5Gr_ehUZY"))
          web_config = patch_environment_variable(web_config, "Identity__OtpDelivery__Slack__WebhookUrl", os.environ["OTP_SLACK_WEBHOOK"])
          ftp.storbinary("STOR web.config", io.BytesIO(web_config.encode("utf-8")))

          print("==> Stopping IIS process with app_offline.htm...")
          ftp.cwd(remote_root)
          ftp.storbinary("STOR app_offline.htm", io.BytesIO(b"<!DOCTYPE html><html><body><h1>Deploying updates...</h1></body></html>"))
          time.sleep(4)

          files = []
          for root, _, filenames in os.walk(local_dir):
              for f in filenames:
                  lp = os.path.join(root, f)
                  rp = os.path.relpath(lp, local_dir).replace("\\", "/")
                  if rp.startswith("runtimes/linux") or rp.startswith("runtimes/osx"):
                      continue
                  if rp == "web.config":
                      continue
                  files.append((lp, rp))

          total = len(files)
          print(f"==> Uploading {total} files...")
          uploaded = 0
          for lp, rp in files:
              rdir = os.path.dirname(rp)
              rfile = os.path.basename(rp)
              for attempt in range(3):
                  try:
                      ftp.cwd(remote_root)
                      if rdir:
                          ensure_remote_dir(ftp, rdir)
                          ftp.cwd(remote_root + "/" + rdir)
                      with open(lp, "rb") as fh:
                          ftp.storbinary(f"STOR {rfile}", fh)
                      uploaded += 1
                      if uploaded % 20 == 0 or uploaded == total:
                          print(f"    Uploaded: [{uploaded}/{total}]")
                      break
                  except Exception as e:
                      print(f"    [Retry {attempt+1}] {rp}: {e}")
                      time.sleep(1)
                      try: ftp.quit()
                      except: pass
                      ftp = get_ftp()

          print("==> Starting app by removing app_offline.htm...")
          ftp.cwd(remote_root)
          try:
              ftp.delete("app_offline.htm")
          except Exception as e:
              print(f"Warning deleting app_offline: {e}")
          ftp.quit()

          print("==> Waiting 6 seconds for boot...")
          time.sleep(6)

          print("==> Verifying Health...")
          for i in range(8):
              try:
                  req = urllib.request.Request("http://mal3abk.runasp.net/health/ready", headers={"User-Agent": "GitHubActions/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as res:
                      if res.status == 200:
                          print("==> Deployment Successful! Health: 200 OK")
                          sys.exit(0)
              except Exception as e:
                  print(f"    Waiting for startup ({i+1}/8): {e}")
                  time.sleep(4)
          print("==> Health verification timed out.")
          sys.exit(1)
          EOF

      - name: Collect startup diagnostics
        if: failure()
        env:
          FTP_HOST: ${{ secrets.MONSTERASP_FTP_SERVER }}
          FTP_USER: ${{ secrets.MONSTERASP_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.MONSTERASP_FTP_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import ftplib, os, pathlib

          host = os.environ["FTP_HOST"]
          user = os.environ["FTP_USER"]
          password = os.environ["FTP_PASS"]
          output_dir = pathlib.Path("startup-diagnostics")
          output_dir.mkdir(exist_ok=True)

          ftp = ftplib.FTP(host, timeout=30)
          ftp.login(user, password)
          entries = ftp.nlst("/wwwroot/logs")
          logs = [entry for entry in entries if entry.lower().endswith(".log")]
          if logs:
              latest = sorted(logs)[-1]
              destination = output_dir / pathlib.PurePosixPath(latest).name
              with destination.open("wb") as stream:
                  ftp.retrbinary(f"RETR {latest}", stream.write)
              print(f"Collected startup log: {destination.name}")
          else:
              print("No startup log was found in /wwwroot/logs")
          ftp.quit()
          EOF

      - name: Upload startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monsterasp-startup-diagnostics
          path: startup-diagnostics/
          if-no-files-found: warn
