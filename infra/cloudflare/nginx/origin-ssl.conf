# ==============================================================================
# Nginx Origin Configuration with Cloudflare Authenticated Origin Pulls (mTLS)
# ==============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.malabak.app;

    # Origin CA Certificate issued by Cloudflare
    ssl_certificate         /etc/ssl/certs/malabak-origin-ca.crt;
    ssl_certificate_key     /etc/ssl/private/malabak-origin-ca.key;

    # Enforce Authenticated Origin Pulls (mTLS)
    # Download Cloudflare client CA from: https://developers.cloudflare.com/ssl/origin-configuration/authenticated-origin-pull/set-up/
    ssl_client_certificate  /etc/ssl/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client       on;

    # Strong TLS Parameters
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;

    # Strict HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket support (SignalR)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Forward real headers (verified by CloudflareRealIpMiddleware)
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header   CF-Ray $http_cf_ray;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
