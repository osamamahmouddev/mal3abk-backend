services:
  postgres:
    image: postgres:17-alpine
    container_name: malabak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: malabak_dev
      POSTGRES_USER: malabak
      POSTGRES_PASSWORD: malabak_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malabak -d malabak_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  seeder:
    image: mcr.microsoft.com/dotnet/sdk:9.0-alpine
    container_name: malabak-seeder
    profiles: ["tools", "seed"]
    working_dir: /app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=malabak_dev;Username=malabak;Password=malabak_dev_password
      - ConnectionStrings__Redis=redis:6379,password=malabak_dev_redis_password
    volumes:
      - ./:/app
    command: ["dotnet", "run", "--project", "src/Malabak.Api/Malabak.Api.csproj", "--", "--seed-reference", "--seed-demo"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    container_name: malabak-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "malabak_dev_redis_password"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "malabak_dev_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: malabak-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: malabak-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
  redis_data:
  seq_data:
