# Fly.io STAGING only: test data, OTP codes in Slack. Not for production — ADR-0004 keeps real
# users' data in a compliant region, and ams (Amsterdam) is not one. Secrets are set with
# `fly secrets set`, never here; see docs/runbooks/fly-staging.md.
app = "mal3abk-backend"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Applies EF Core migrations once per deploy, before new machines start.
  release_command = "dotnet Malabak.Api.dll --migrate"

[env]
  ASPNETCORE_ENVIRONMENT = "Staging"
  # appsettings.json turns this on for local work; the API refuses to start with it outside Development.
  Hangfire__BypassDashboardAuthInDevelopment = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health/live"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
